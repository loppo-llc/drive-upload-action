name: Drive Upload Action
description: Upload a file or zipped directory to Google Drive using a service account.
author: Seibe

inputs:
  source:
    description: Path to a file or directory to upload.
    required: true
  name:
    description: Optional destination file name on Drive.
    required: false
  mime-type:
    description: Optional mime type override.
    required: false
  parent-folder-id:
    description: |
      Parent Google Drive folder ID. Defaults to root.
      Multiple IDs can be specified separated by commas or newlines to upload the same file to multiple folders.
      Duplicate IDs are deduplicated (first occurrence wins).
      With conflict-behavior=overwrite or skip, destinations are processed sequentially; if one destination fails after others have already been written, the earlier writes are not rolled back.
      With conflict-behavior=error, all destinations are checked for conflicts before any upload/update starts, so a conflict in any destination fails the run without uploading. Note that folder-path resolution may still create intermediate folders as a side effect during the preflight.
    required: false
    default: root
  folder-path:
    description: "Optional nested folder path created under parent-folder-id (example: release/nightly)."
    required: false
  drive-id:
    description: Optional shared drive ID to scope folder/file lookups.
    required: false
  archive-folder:
    description: When source is a directory, upload as zip if true.
    required: false
    default: 'true'
  conflict-behavior:
    description: "What to do if same filename exists in destination: overwrite, skip, error."
    required: false
    default: overwrite
  service-account-json:
    description: Service account JSON credentials.
    required: false
  service-account-json-base64:
    description: Base64 encoded service account JSON credentials.
    required: false
  subject:
    description: Optional user email for domain-wide delegation impersonation.
    required: false
  max-retries:
    description: Maximum retry count for transient Drive/API failures.
    required: false
    default: '5'
  initial-retry-delay-ms:
    description: Initial delay in ms used for exponential backoff.
    required: false
    default: '1000'
  request-timeout-ms:
    description: HTTP request timeout in milliseconds.
    required: false
    default: '120000'

outputs:
  file-id:
    description: Uploaded (or reused) Drive file ID. When multiple parent-folder-id values are given, this is the ID for the first destination.
  file-name:
    description: Uploaded (or reused) Drive file name (first destination).
  mime-type:
    description: Mime type of the file in Drive (first destination).
  size-bytes:
    description: File size in bytes (first destination).
  web-view-link:
    description: Drive webViewLink when available (first destination).
  web-content-link:
    description: Drive webContentLink when available (first destination).
  file-ids:
    description: Newline-separated Drive file IDs, one per parent-folder-id, in input order.
  file-names:
    description: Newline-separated Drive file names, one per parent-folder-id, in input order.
  mime-types:
    description: Newline-separated mime types, one per parent-folder-id, in input order.
  size-bytes-list:
    description: Newline-separated file sizes in bytes, one per parent-folder-id, in input order.
  web-view-links:
    description: Newline-separated Drive webViewLinks, one per parent-folder-id, in input order.
  web-content-links:
    description: Newline-separated Drive webContentLinks, one per parent-folder-id, in input order.

runs:
  using: node24
  main: dist/index.js

branding:
  icon: upload-cloud
  color: blue